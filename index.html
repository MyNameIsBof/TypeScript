<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link href="/src/styles.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Vite + React</title>
  </head>
  <body>
    <header class="bg-blue-600 text-white p-4">
      <h1 class="text-3xl font-bold">Welcome to Tailwind Demo</h1>
    </header>
    <main class="p-6">
      <section class="bg-white p-4 rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold">About Us</h2>
        <p class="mt-2 text-gray-600">
          This is a simple demo website built with Tailwind CSS. We are
          showcasing a clean and minimal design.
        </p>
      </section>
      <section class="bg-white p-4 rounded-lg shadow-md mt-4">
        <h2 class="text-2xl font-semibold">Our Services</h2>
        <ul class="list-disc ml-6 text-gray-600">
          <li>Web Development</li>
          <li>UI/UX Design</li>
          <li>SEO Optimization</li>
        </ul>
      </section>
      <section class="bg-white p-4 rounded-lg shadow-md mt-4">
        <h2 class="text-2xl font-semibold">Contact Us</h2>
        <form class="mt-2 space-y-2">
          <input
            type="text"
            placeholder="Your Name"
            class="w-full p-2 border border-gray-300 rounded"
          />
          <input
            type="email"
            placeholder="Your Email"
            class="w-full p-2 border border-gray-300 rounded"
          />
          <textarea
            placeholder="Your Message"
            class="w-full p-2 border border-gray-300 rounded"
          ></textarea>
          <button class="bg-blue-600 text-white px-4 py-2 rounded">Send</button>
        </form>
      </section>
    </main>
    <footer class="bg-blue-600 text-white text-center p-4 mt-4">
      <p>&copy; 2025 Tailwind Demo. All rights reserved.</p>
    </footer>
  </body>
</html>
